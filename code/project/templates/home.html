{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center">
        <h1 style="text-align: center; margin-top: 1em;">
            Animal Shelter at VUT FIT
        </h1>
        <!-- Search bar -->
        <div class="col-md-5" style="margin-top: 1em; margin-bottom: 2em;">
            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search animal" aria-label="Search">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>
    </div>
    <!-- Main content container -->
    <div class="container-fluid">
        <div class="row">
            <!-- Animal cards column -->
            <div class="col">
                <div class="container-fluid">
                    <!-- Setup grid with default 6 cards per row -->
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-lg-5 justify-content-md-center">
                        <!-- Example card -->
                        <div class="col mb-3">
                            <div class="card p-2" style="width: 20em; height: 20em;" id="cards1" onclick="showDetails(this.id)">
                                <img src="..." class="card-img-top" alt="...">
                                <div class="card-body">
                                    <h5 class="card-title">Animal 1</h5>
                                    <p class="card-text">Example text.</p>
                                    <a href="#" class="btn btn-primary">Take me for a walk</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Animal details column -->
            <div class="col-3" id="details-container" style="display: none;">
                <!-- Details section container -->
                <div class="container">
                    <div class="col-col-3">
                        <!-- Card details widget -->
                        <div class="card" style="height: 30em;">
                            <button type="button" class="btn-close" aria-label="Close" style="position: absolute; right: 5px; top: 5px;" onclick="hideDetails()"></button>
                            <div class="card-body">
                                <h5 class="card-title">Details</h5>
                                <p id="details-content" class="card-text"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showDetails(cardId) {
            document.getElementById('details-content').innerText = "Details for card " + cardId;
            document.getElementById('details-container').style.display = 'block';
        }

        function hideDetails() {
            document.getElementById('details-container').style.display = 'none';
        }
    </script>
{% endblock %}
