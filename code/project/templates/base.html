<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Animal Shelter</title>
    <!-- Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Styles -->
    <style>
      .btn-primary {
        background-color: #00ABE3; /*Official FIT-blue color*/
        border: none;
      }
    </style>
  </head>
  <body>
    <!-- Navbar should be default for all pages -->
    {% include 'navbar.html' %}

    <div class="container">
        <!-- Show any available messages -->
        {% if messages %}
          {% for message in messages %}
            <!-- Determine label color and icon by message type -->
            {% if message.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}
              <div class="alert alert-success alert-dismissible fade show" role="alert">
            {% elif message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <!-- Show message -->
                <div>
                  {{ message }}
                </div>
                <!-- Dismiss button -->
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endif %}
          {% endfor %}
        {% endif %}
        <!-- Django content taken from dependent HTML pages -->
        {% block content %}
        {% endblock %}
    </div>
    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
