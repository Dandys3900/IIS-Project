{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <h1 class="card-title text-center">Volunteers to verify</h1>
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for volunteer in volunteers %}
                    <tr>
                        <td>{{ volunteer.user_id }}</td>
                        <td>{{ volunteer.first_name }} {{ volunteer.last_name }}</td>
                        <td>{{ volunteer.username }}</td>
                        <td>
                            <a href="{% url 'volunteerverify' volunteer.user_id %}" class="btn btn-primary">Verify</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
