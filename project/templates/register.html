{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center align-items-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title text-center">Register</h3>
                    <form method="POST">
                        <!-- Django requires this token for enhanced security -->
                        {% csrf_token %}
                        <!-- Render form -->
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary btn-block">Register</button>
                        {% if not user %}
                            <br>
                            <br>
                            <label>
                                Already have an account?
                                <button><a href="/login">Login</a></button>
                            </label>
                        {% endif %}
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
