{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center align-items-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title text-center">Delete</h3>
                    <form method="POST">
                        <!-- Django requires this token for enhanced security -->
                        {% csrf_token %}
                        <!-- Render form -->
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-danger btn-block">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
